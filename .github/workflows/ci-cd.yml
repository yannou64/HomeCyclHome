name: CI/CD

on:
    # Push sur dev / main = fusion d'une PR : c'est ce qui déclenche le build et
    # le déploiement (staging pour dev, production pour main).
    push:
        branches: [dev, main]
    # Une branche de travail est testée via sa PR, sur le résultat de sa fusion
    # avec la branche cible. Pas de déclenchement sur son push : il ferait
    # doublon. Pour un retour avant la fin du travail, ouvrir la PR en brouillon.
    pull_request:
        branches: [main, dev]

jobs:
    lint-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Cloner le dépot
              uses: actions/checkout@v4
            - name: Installer Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: cd Frontend && npm ci
            - run: cd Frontend && npm run lint

    lint-backend:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: cd Backend && npm ci
            - run: cd Backend && npx prisma generate
            - run: cd Backend && npm run lint

    # Tests unitaires puis tests d'intégration (Supertest + PostgreSQL).
    # Les deux dans ce job : test-backend est un check obligatoire des PR.
    test-backend:
        runs-on: ubuntu-latest
        # Base PostgreSQL jetable, détruite à la fin du job. Ses identifiants
        # ne protègent rien : ce ne sont pas des secrets.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: ci
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: homecycl_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ci -d homecycl_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        # En CI, pas de .env.test : les variables viennent d'ici. Le nom de la
        # base finit par _test, sinon le garde-fou du banc arrête les tests.
        env:
            NODE_ENV: test
            DATABASE_URL: 'postgresql://ci:ci@localhost:5432/homecycl_test'
            JWT_ACCESS_SECRET: secret-acces-ci
            JWT_REFRESH_SECRET: secret-refresh-ci
            FRONTEND_URL: 'http://localhost:5173'
            MAIL_HOST: localhost
            MAIL_PORT: '1025'
            MAIL_USER: ci
            MAIL_PASS: ci
            MAIL_FROM: 'ci@homecyclhome.test'
            AWS_REGION: eu-west-3
            AWS_S3_BUCKET: bucket-ci
            AWS_ACCESS_KEY_ID: ci
            AWS_SECRET_ACCESS_KEY: ci
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: cd Backend && npm ci
            - run: cd Backend && npx prisma generate
            - run: cd Backend && npm test
            - run: cd Backend && npm run test:e2e

    # ----  BUILD AND PUSH GHCR
    build-and-push-staging:
        runs-on: ubuntu-latest
        needs: [lint-frontend, lint-backend, test-backend]
        if: github.ref == 'refs/heads/dev'
        steps:
            - name: Cloner le dépôt
              uses: actions/checkout@v4

            - name: Connexion à GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build et push Backend staging
              uses: docker/build-push-action@v5
              with:
                  context: ./Backend
                  push: true
                  tags: ghcr.io/yannou64/homecyclhome-backend:staging

            - name: Build et push Frontend staging
              uses: docker/build-push-action@v5
              with:
                  context: ./Frontend
                  push: true
                  tags: ghcr.io/yannou64/homecyclhome-frontend:staging
                  build-args: |
                      VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

    build-and-push-prod:
        runs-on: ubuntu-latest
        needs: [lint-frontend, lint-backend, test-backend]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Cloner le dépôt
              uses: actions/checkout@v4

            - name: Connexion à GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build et push Backend prod
              uses: docker/build-push-action@v5
              with:
                  context: ./Backend
                  push: true
                  tags: ghcr.io/yannou64/homecyclhome-backend:prod

            - name: Build et push Frontend prod
              uses: docker/build-push-action@v5
              with:
                  context: ./Frontend
                  push: true
                  tags: ghcr.io/yannou64/homecyclhome-frontend:prod
                  build-args: |
                      VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

    # ---- DÉPLOIEMENT STAGING ----
    deploy-staging:
        runs-on: ubuntu-latest
        # Lance uniquement si la CI est passée et qu'on est sur dev
        needs: [build-and-push-staging]
        if: github.ref == 'refs/heads/dev'
        steps:
            - name: Cloner le dépôt
              uses: actions/checkout@v4
            - name: Copier les fichiers de config
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  source: 'docker-compose.staging.yml,nginx/staging.conf'
                  target: '/app/homecyclhome'
            - name: Déploiement sur le VPS staging
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  script: |
                      cd /app/homecyclhome
                      echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u yannou64 --password-stdin
                      docker compose --env-file .env.staging -f docker-compose.staging.yml pull
                      docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
                      docker restart homecyclhome_staging_nginx
                      # Supprime les images orphelines laissées par le pull (anciennes versions du tag),
                      # APRÈS le up -d : avant, la nouvelle image ne serait utilisée par aucun conteneur.
                      docker image prune -f

    # ---- DÉPLOIEMENT PROD ----
    deploy-prod:
        runs-on: ubuntu-latest
        # Lance uniquement si la CI est passée et qu'on est sur main
        needs: [build-and-push-prod]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Cloner le dépôt
              uses: actions/checkout@v4
            - name: Copier les fichiers de config
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  source: 'docker-compose.prod.yml,nginx/prod.conf'
                  target: '/app/homecyclhome-prod'
            - name: Déploiement sur le VPS prod
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  script: |
                      cd /app/homecyclhome-prod
                      echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u yannou64 --password-stdin
                      docker compose --env-file .env.prod -f docker-compose.prod.yml pull
                      docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
                      docker restart homecyclhome_prod_nginx
                      # Supprime les images orphelines laissées par le pull (anciennes versions du tag),
                      # APRÈS le up -d : avant, la nouvelle image ne serait utilisée par aucun conteneur.
                      docker image prune -f
